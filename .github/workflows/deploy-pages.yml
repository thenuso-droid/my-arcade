name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          cat > shared/firebase-config.js <<EOF
          window.ARCADE_FIREBASE_CONFIG = {
            apiKey: "${FIREBASE_API_KEY}",
            authDomain: "my-arcade-leaderboard.firebaseapp.com",
            projectId: "my-arcade-leaderboard",
            storageBucket: "my-arcade-leaderboard.firebasestorage.app",
            messagingSenderId: "5027936744",
            appId: "1:5027936744:web:5e14da2c2025edcbdfcc5d",
            measurementId: "G-41T7WXHW2X"
          };
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
